name: Capture CC Pocket UI refresh evidence

on:
  workflow_dispatch:
    inputs:
      verification:
        type: choice
        options: [screenshots, bridge, icons, ipa, menubar, polish, zh-previews, ios-system-language]
        default: screenshots
      source_ref:
        description: App commit to build or generate from
        type: string
        default: feat/zh-gallery-polish
      ipa_run:
        description: Successful TrollStore build run ID
        type: string
        required: false

permissions:
  contents: read
  actions: read

jobs:
  screenshots:
    if: inputs.verification == 'screenshots'
    name: Flutter UI (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: before
            ref: c60c212b54ed35592e595e1162bc2ba3dee15a34
          - variant: after
            ref: 31ada26bac19ee7ec9e11c80222caa551ec8319d
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.ref }}
      - name: Read Flutter version
        id: mise
        run: echo "flutter_version=$(grep 'flutter' .mise.toml | sed 's/.*= *\"//' | sed 's/\"//')" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ steps.mise.outputs.flutter_version }}
          cache: true
      - name: Render the app's HomeContent at iPhone width with mock data
        working-directory: apps/mobile
        env:
          CCPOCKET_UI_VARIANT: ${{ matrix.variant }}
        run: |
          flutter pub get
          python3 - <<'PY'
          from pathlib import Path

          source = Path('test/home_content_skeleton_test.dart').read_text()
          imports = """import 'dart:io';
          import 'dart:typed_data';
          import 'package:flutter/rendering.dart' show RenderRepaintBoundary;
          import 'package:flutter/services.dart' show FontLoader;
          import 'package:ccpocket/features/session_list/widgets/session_list_app_bar.dart';
          import 'package:ccpocket/mock/store_screenshot_data.dart';
          import 'ui_surface_capture.dart';
          """
          source = imports + source
          source = source.replace(
              'Widget _buildHomeContent({',
              "Widget _buildHomeContent({\n  GlobalKey? screenshotKey,\n  ThemeData? screenshotTheme,",
              1,
          )
          source = source.replace(
              '      theme: AppTheme.darkTheme,\n      home: Scaffold(',
              """      theme: screenshotTheme ?? AppTheme.darkTheme,
                debugShowCheckedModeBanner: false,
                builder: (context, child) => RepaintBoundary(
                  key: screenshotKey,
                  child: child,
                ),
                home: Scaffold(
                  appBar: screenshotKey != null
                      ? PreferredSize(
                          preferredSize: const Size.fromHeight(kToolbarHeight),
                          child: CustomScrollView(
                            physics: const NeverScrollableScrollPhysics(),
                            slivers: [
                              SessionListSliverAppBar(
                                bridgeLabel: 'Demo Bridge',
                                onTitleTap: () {},
                                onDisconnect: () {},
                                onOpenSettings: () {},
                                onOpenGallery: () {},
                                isConnected: true,
                              ),
                            ],
                          ),
                        )
                      : null,""",
              1,
          )
          marker = "  group('HomeContent skeleton', () {"
          assert source.count(marker) == 1
          source = source.replace(marker, """  testWidgets('capture refresh evidence', (tester) async {
              tester.view.devicePixelRatio = 1;
              tester.view.physicalSize = const Size(402, 874);
              addTearDown(tester.view.resetDevicePixelRatio);
              addTearDown(tester.view.resetPhysicalSize);
              await tester.runAsync(() async {
                const fontPath = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf';
                final font = File(fontPath).existsSync()
                    ? File(fontPath)
                    : File('assets/fonts/code/DejaVuSansMono.ttf');
                final loader = FontLoader('EvidenceSans');
                loader.addFont(font.readAsBytes().then(ByteData.sublistView));
                await loader.load();
                final materialIcons =
                    File(Platform.environment['CCPOCKET_MATERIAL_ICONS']!);
                final iconLoader = FontLoader('MaterialIcons');
                iconLoader.addFont(
                  materialIcons.readAsBytes().then(ByteData.sublistView),
                );
                await iconLoader.load();
              });
              final out = Directory(Platform.environment['CCPOCKET_UI_OUTPUT']!);
              out.createSync(recursive: true);

              for (final (name, theme) in [
                ('home-light', AppTheme.lightTheme),
                ('home-dark', AppTheme.darkTheme),
              ]) {
                final key = GlobalKey();
                await tester.pumpWidget(
                  _buildHomeContent(
                    sessions: storeHomeRunningSessions().take(1).toList(),
                    recentSessions: storeRecentSessions(),
                    screenshotKey: key,
                    screenshotTheme: captureTheme(theme),
                    cubit: cubit,
                    draftService: draftService,
                    revenueCatService: revenueCatService,
                    supportBannerService: supportBannerService,
                  ),
                );
                await tester.pump(const Duration(milliseconds: 500));
                expect(find.text('CC Pocket'), findsOneWidget);
                expect(find.byType(HomeContent), findsOneWidget);
                expect(tester.takeException(), isNull);
                await tester.runAsync(() async {
                  final boundary =
                      key.currentContext!.findRenderObject()! as RenderRepaintBoundary;
                  final image = await boundary.toImage(pixelRatio: 2);
                  final bytes = (await image.toByteData())!.buffer.asUint8List();
                  final png = await image.toByteData(format: ImageByteFormat.png);
                  expect(bytes, isNotEmpty);
                  File('${out.path}/$name.png').writeAsBytesSync(
                    png!.buffer.asUint8List(png.offsetInBytes, png.lengthInBytes),
                  );
                  image.dispose();
                });
                await tester.pumpWidget(const SizedBox.shrink());
              }
            });

          """ + marker)
          source = "import 'dart:ui' show ImageByteFormat;\n" + source
          Path('test/ui_refresh_evidence_test.dart').write_text(source)

          # The headless engine lacks the desktop drag-and-drop plugin.
          composer = Path('lib/features/chat_session/widgets/chat_input_with_overlays.dart')
          text = composer.read_text()
          assert text.count('enabled: isDesktopPlatform,') == 1
          composer.write_text(text.replace('enabled: isDesktopPlatform,', 'enabled: false,'))
          connection = Path('lib/features/session_list/widgets/connect_form.dart')
          text = connection.read_text()
          assert text.count('!kIsWeb && !isDesktopPlatform') == 1
          connection.write_text(text.replace('!kIsWeb && !isDesktopPlatform', '!kIsWeb'))
          PY
          cat > test/ui_surface_capture.dart <<'DART'
          import 'dart:io';
          import 'dart:typed_data';
          import 'dart:ui' show ImageByteFormat;
          import 'package:flutter/material.dart';
          import 'package:flutter/rendering.dart' show RenderRepaintBoundary;
          import 'package:flutter/services.dart' show FontLoader;
          import 'package:flutter_test/flutter_test.dart';

          Future<void> prepareCapture(WidgetTester tester) async {
            tester.view.devicePixelRatio = 1;
            tester.view.physicalSize = const Size(402, 874);
            addTearDown(tester.view.resetDevicePixelRatio);
            addTearDown(tester.view.resetPhysicalSize);
            await tester.runAsync(() async {
              for (final (name, path) in [
                ('EvidenceSans', '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'),
                ('MaterialIcons', Platform.environment['CCPOCKET_MATERIAL_ICONS']!),
              ]) {
                final loader = FontLoader(name);
                loader.addFont(File(path).readAsBytes().then(ByteData.sublistView));
                await loader.load();
              }
            });
          }

          ThemeData captureTheme(ThemeData theme) {
            final text = theme.textTheme.apply(fontFamily: 'EvidenceSans');
            return theme.copyWith(
              platform: TargetPlatform.iOS,
              textTheme: text,
              appBarTheme: theme.appBarTheme.copyWith(
                titleTextStyle: theme.appBarTheme.titleTextStyle?.copyWith(
                  fontFamily: 'EvidenceSans',
                ),
              ),
              filledButtonTheme: FilledButtonThemeData(
                style: (theme.filledButtonTheme.style ?? const ButtonStyle()).copyWith(
                  textStyle: WidgetStatePropertyAll(text.labelLarge),
                ),
              ),
              inputDecorationTheme: theme.inputDecorationTheme.copyWith(
                hintStyle: theme.inputDecorationTheme.hintStyle?.copyWith(
                  fontFamily: 'EvidenceSans',
                ),
              ),
            );
          }

          Future<void> writeCapture(WidgetTester tester, GlobalKey key, String name) async {
            await tester.pump(const Duration(milliseconds: 500));
            expect(tester.takeException(), isNull);
            await tester.runAsync(() async {
              final frame = key.currentContext!.findRenderObject()! as RenderRepaintBoundary;
              final image = await frame.toImage(pixelRatio: 2);
              final bytes = (await image.toByteData(format: ImageByteFormat.png))!;
              final output = Directory(Platform.environment['CCPOCKET_UI_OUTPUT']!);
              output.createSync(recursive: true);
              File('${output.path}/$name.png').writeAsBytesSync(
                bytes.buffer.asUint8List(bytes.offsetInBytes, bytes.lengthInBytes),
              );
              image.dispose();
            });
            await tester.pumpWidget(const SizedBox.shrink());
          }
          DART

          cat > test/ui_surface_evidence_test.dart <<'DART'
          import 'package:ccpocket/features/gallery/widgets/gallery_empty_state.dart';
          import 'package:ccpocket/features/session_list/widgets/connect_form.dart';
          import 'package:ccpocket/l10n/app_localizations.dart';
          import 'package:ccpocket/models/messages.dart';
          import 'package:ccpocket/theme/app_theme.dart';
          import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';
          import 'chat_screen/helpers/chat_test_helpers.dart';
          import 'ui_surface_capture.dart';

          void main() {
            testWidgets('capture refresh evidence: session and connection', (tester) async {
              await prepareCapture(tester);
              for (final (name, theme) in [
                ('light', captureTheme(AppTheme.lightTheme)),
                ('dark', captureTheme(AppTheme.darkTheme)),
              ]) {
                final bridge = MockBridgeService();
                final source = await buildTestCodexSessionScreen(
                  bridge: bridge,
                  projectPath: '/tmp/checkout',
                ) as MaterialApp;
                final key = GlobalKey();
                await tester.pumpWidget(MaterialApp(
                  localizationsDelegates: source.localizationsDelegates,
                  supportedLocales: source.supportedLocales,
                  locale: source.locale,
                  debugShowCheckedModeBanner: false,
                  theme: theme,
                  builder: (context, child) => RepaintBoundary(key: key, child: child),
                  home: source.home,
                ));
                await pumpN(tester);
                await emitAndPump(tester, bridge, [
                  SessionContextMessage(
                    sessionId: testSessionId,
                    context: SessionInfo(
                      id: testSessionId,
                      name: 'Checkout review',
                      projectPath: '/tmp/checkout',
                      provider: 'codex',
                      status: 'running',
                      createdAt: DateTime.now().toIso8601String(),
                      lastActivityAt: DateTime.now().toIso8601String(),
                      gitBranch: 'feat/checkout',
                      codexApprovalPolicy: 'never',
                      codexSandboxMode: 'danger-full-access',
                    ),
                  ),
                  makeAssistantMessage(
                    'answer-1',
                    'The checkout now keeps the cart when payment fails.',
                    toolUses: [
                      const ToolUseContent(
                        id: 'tool-1', name: 'Bash',
                        input: {'command': 'flutter test test/checkout_test.dart'},
                      ),
                    ],
                  ),
                  const ToolResultMessage(toolUseId: 'tool-1', content: 'All tests passed.'),
                  makeAssistantMessage(
                    'answer-3',
                    'I updated the error message and kept the retry action available.',
                    toolUses: [
                      const ToolUseContent(
                        id: 'tool-2', name: 'Bash',
                        input: {'command': 'git diff --stat'},
                      ),
                      const ToolUseContent(
                        id: 'tool-3', name: 'Bash',
                        input: {'command': 'git status --short'},
                      ),
                    ],
                  ),
                  const ToolResultMessage(toolUseId: 'tool-2', content: '2 files changed.'),
                  const ToolResultMessage(toolUseId: 'tool-3', content: 'M checkout_view.dart'),
                  makeAssistantMessage(
                    'answer-2',
                    'I am checking that a successful retry clears the error banner.',
                  ),
                  const StatusMessage(status: ProcessStatus.running),
                ]);
                expect(find.textContaining('a successful retry', findRichText: true), findsWidgets);
                await writeCapture(tester, key, 'session-$name');
                bridge.dispose();
                for (final (pageName, content) in [
                  ('connect', ConnectForm(
                    discoveredServers: const [],
                    onScanQrCode: () {},
                    onConnectToDiscovered: (_) {},
                    onViewSetupGuide: () {},
                  )),
                  ('gallery', const GalleryEmptyState(isSessionMode: false)),
                ]) {
                  final pageKey = GlobalKey();
                  await tester.pumpWidget(MaterialApp(
                    localizationsDelegates: AppLocalizations.localizationsDelegates,
                    supportedLocales: AppLocalizations.supportedLocales,
                    locale: const Locale('en'),
                    debugShowCheckedModeBanner: false,
                    theme: theme,
                    builder: (context, child) => RepaintBoundary(key: pageKey, child: child),
                    home: Scaffold(
                      appBar: AppBar(title: Text(pageName == 'connect' ? 'CC Pocket' : 'Gallery')),
                      body: content,
                    ),
                  ));
                  await writeCapture(tester, pageKey, '$pageName-$name');
                }
              }
            });
          }
          DART

          python3 - <<'PY'
          from pathlib import Path

          source = Path('test/settings_usage_visibility_test.dart').read_text()
          source = """import 'package:ccpocket/theme/app_theme.dart';
          import 'ui_surface_capture.dart';
          """ + source
          target = "  bool focusConnection = false,"
          assert source.count(target) == 1
          source = source.replace(target, "  GlobalKey? captureKey,\n  ThemeData? theme,\n" + target)
          target = "      child: MaterialApp("
          assert source.count(target) == 1
          source = source.replace(target, target + """
                  debugShowCheckedModeBanner: false,
                  theme: theme,
                  builder: (context, child) => RepaintBoundary(key: captureKey, child: child),
          """)
          marker = "  group('Settings usage visibility', () {"
          assert source.count(marker) == 1
          source = source.replace(marker, """  testWidgets('capture refresh evidence: settings', (tester) async {
              await prepareCapture(tester);
              SharedPreferences.setMockInitialValues({});
              final prefs = await SharedPreferences.getInstance();
              final settings = _SeededSettingsCubit(prefs, activeMachineId: 'demo');
              final machines = _StaticMachineManagerService([
                MachineWithStatus(
                  machine: Machine(id: 'demo', name: 'Workstation', host: '127.0.0.1'),
                  status: MachineStatus.online,
                ),
              ]);
              final manager = _createMachineManagerCubit(machines);
              final bridge = _FakeBridgeService(
                connected: true, fakeLastUrl: 'ws://localhost:8765',
              );
              for (final (name, theme) in [
                ('light', AppTheme.lightTheme),
                ('dark', AppTheme.darkTheme),
              ]) {
                final key = GlobalKey();
                await tester.pumpWidget(await _buildScreen(
                  bridge: bridge, settingsCubit: settings,
                  machineManagerCubit: manager, captureKey: key,
                  theme: captureTheme(theme),
                ));
                await writeCapture(tester, key, 'settings-$name');
              }
              await settings.close();
              await manager.close();
              machines.dispose();
              bridge.dispose();
            });
          """ + marker)
          Path('test/ui_settings_evidence_test.dart').write_text(source)
          PY
          export CCPOCKET_UI_OUTPUT="$RUNNER_TEMP/ccpocket-ui"
          flutter_sdk="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          export CCPOCKET_MATERIAL_ICONS="$flutter_sdk/bin/cache/artifacts/material_fonts/MaterialIcons-Regular.otf"
          if [ -f assets/fonts/icons/CCPocketIcons.otf ]; then
            export CCPOCKET_MATERIAL_ICONS="$PWD/assets/fonts/icons/CCPocketIcons.otf"
          fi
          flutter test --no-pub --concurrency=1 --plain-name 'capture refresh evidence' \
            test/ui_refresh_evidence_test.dart test/ui_surface_evidence_test.dart test/ui_settings_evidence_test.dart
          cp assets/icon.png "$CCPOCKET_UI_OUTPUT/launcher.png"
          cp assets/icon_light_outline.png "$CCPOCKET_UI_OUTPUT/launcher-light.png"
          cp assets/icon_pro_copper_emerald.png "$CCPOCKET_UI_OUTPUT/launcher-supporter.png"
          printf '%s\n' "$(git rev-parse HEAD)" > "$CCPOCKET_UI_OUTPUT/commit.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: CC-Pocket-UI-${{ matrix.variant }}
          path: ${{ runner.temp }}/ccpocket-ui
          if-no-files-found: error
          retention-days: 30
  icons:
    if: inputs.verification == 'icons'
    name: Generate application and launcher icons
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: c60c212b54ed35592e595e1162bc2ba3dee15a34
          path: project
      - name: Read Flutter version
        id: mise
        run: echo "flutter_version=$(grep 'flutter' project/.mise.toml | sed 's/.*= *\"//' | sed 's/\"//')" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ steps.mise.outputs.flutter_version }}
          cache: true
      - name: Generate and validate icon assets
        run: |
          flutter_sdk="$(dirname "$(dirname "$(readlink -f "$(command -v flutter)")")")"
          python3 -m venv "$RUNNER_TEMP/icon-generator"
          "$RUNNER_TEMP/icon-generator/bin/pip" install fonttools==4.56.0 Pillow==11.3.0
          "$RUNNER_TEMP/icon-generator/bin/python" scripts/ui-icon-assets/generate.py project/apps/mobile "$flutter_sdk"
          git -C project ls-files -m -o --exclude-standard -z apps/mobile +            | tar --null -C project -T - -czf "$RUNNER_TEMP/ccpocket-icon-assets.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: CC-Pocket-icon-assets
          path: ${{ runner.temp }}/ccpocket-icon-assets.tar.gz
          if-no-files-found: error
  ipa:
    if: inputs.verification == 'ipa'
    name: Verify the installed asset manifest in the TrollStore IPA
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 31ada26bac19ee7ec9e11c80222caa551ec8319d
      - name: Check version, bundle identity and font inclusion
        env:
          GH_TOKEN: ${{ github.token }}
          IPA_RUN: ${{ inputs.ipa_run }}
        run: |
          [[ "$IPA_RUN" =~ ^[0-9]+$ ]]
          gh run download "$IPA_RUN" --repo "$GITHUB_REPOSITORY" \
            --name CC-Pocket-TrollStore-unsigned-31ada26bac19ee7ec9e11c80222caa551ec8319d \
            --dir "$RUNNER_TEMP/ios-artifact"
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json, os, plistlib

          ipa = Path(os.environ['RUNNER_TEMP']) / 'ios-artifact/CC-Pocket-TrollStore-unsigned.ipa'
          asset_root = 'Payload/Runner.app/Frameworks/App.framework/flutter_assets/'
          font = 'assets/fonts/icons/CCPocketIcons.otf'
          with ZipFile(ipa) as archive:
              assert archive.testzip() is None
              info = plistlib.loads(archive.read('Payload/Runner.app/Info.plist'))
              assert info['CFBundleIdentifier'] == 'com.zwthys.ccpocket'
              assert info['CFBundleShortVersionString'] == '1.140.8'
              assert info['CFBundleVersion'] == '271'
              assert 'Payload/Runner.app/Assets.car' in archive.namelist()
              manifest = json.loads(archive.read(asset_root + 'FontManifest.json'))
              icons = [entry for entry in manifest if entry['family'] == 'MaterialIcons']
              assert len(icons) == 1, icons
              assert [item['asset'] for item in icons[0]['fonts']] == [font], icons
              assert archive.read(asset_root + font) == (Path('apps/mobile') / font).read_bytes()
              print('TrollStore 1.140.8+271, app bundle ID, native images and custom Flutter icon font verified.')
          PY
  bridge:
    if: inputs.verification == 'bridge'
    name: Verify packaged Bridge 1.122.0 and authenticated gallery deletion
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.22.1'
      - name: Download and verify the upgrade archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45939314858 --repo "$GITHUB_REPOSITORY" \
            --name bridge-linux-x64-45939314858 --dir "$RUNNER_TEMP/bridge-upgrade"
          cd "$RUNNER_TEMP/bridge-upgrade"
          sha256sum --check bridge-linux-x64.tar.gz.sha256
          tar -xzf bridge-linux-x64.tar.gz
          test "$(cat BUILD_COMMIT)" = fe64d775a1b23b71938f06d827e98e2ded5cf0a3
          node packages/bridge/dist/cli.js --version | grep -Fx 'ccpocket-bridge 1.122.0'
      - name: Upload and delete a disposable image via the packaged runtime
        env:
          BRIDGE_HOST: 127.0.0.1
          BRIDGE_PORT: '18765'
          BRIDGE_API_KEY: ci-gallery-demo-key
          BRIDGE_DISABLE_MDNS: '1'
          BRIDGE_DEMO_MODE: '1'
        run: |
          cd "$RUNNER_TEMP/bridge-upgrade"
          node packages/bridge/dist/cli.js > "$RUNNER_TEMP/bridge-gallery.log" 2>&1 &
          bridge_pid=$!
          trap 'kill "$bridge_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent 'http://127.0.0.1:18765/health' >/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { randomUUID } from 'node:crypto';

          const host = 'http://127.0.0.1:18765';
          const headers = { Authorization: `Bearer ${process.env.BRIDGE_API_KEY}` };
          const health = await fetch(`${host}/health`).then(response => response.json());
          assert.equal(health.status, 'ok');
          assert.equal(health.auth, 'required');

          const upload = await fetch(`${host}/api/gallery/upload`, {
            method: 'POST',
            headers: { ...headers, 'Content-Type': 'application/json' },
            body: JSON.stringify({
              base64: 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+jX1sAAAAASUVORK5CYII=',
              mimeType: 'image/png',
              projectPath: `/tmp/ci-gallery-${randomUUID()}`,
            }),
          });
          const uploaded = await upload.json();
          assert.equal(upload.status, 201, JSON.stringify(uploaded));
          const url = `${host}/api/gallery/${uploaded.image.id}`;
          const missingKey = await fetch(url, { method: 'DELETE' });
          assert.equal(missingKey.status, 401);
          const stored = await fetch(url, { headers });
          assert.equal(stored.status, 200);
          assert.equal(stored.headers.get('content-type'), 'image/png');
          const deletion = await fetch(url, { method: 'DELETE', headers });
          assert.equal(deletion.status, 200);
          assert.deepEqual(await deletion.json(), { deleted: true });
          const removed = await fetch(url, { headers });
          assert.equal(removed.status, 404);
          console.log('Uploaded, authenticated, deleted, and confirmed removal of the disposable gallery image.');
          JS
  menubar:
    if: inputs.verification == 'menubar'
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref }}
      - name: Build localized macOS menu bar app
        run: |
          xcodebuild -project apps/menubar/CCPocketMenubar.xcodeproj -scheme CCPocketMenubar -configuration Release -derivedDataPath "$RUNNER_TEMP/build" CODE_SIGNING_ALLOWED=NO build
          app="$RUNNER_TEMP/build/Build/Products/Release/CCPocketMenubar.app"
          plutil -convert json -o "$RUNNER_TEMP/compiled.json" "$app/Contents/Resources/zh-Hans.lproj/Localizable.strings"
          python3 - <<'PY'
          import json, os, pathlib
          compiled = json.loads((pathlib.Path(os.environ['RUNNER_TEMP']) / 'compiled.json').read_text())
          catalog = json.loads(pathlib.Path('apps/menubar/CCPocketMenubar/Localizable.xcstrings').read_text())
          for key, entry in catalog['strings'].items():
              assert compiled[key] == entry['localizations']['zh-Hans']['stringUnit']['value'], key
          print(f"{len(catalog['strings'])} Simplified Chinese entries match compiled resources.")
          PY
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/CCPocketMenubar.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: CCPocketMenubar-zh-Hans
          path: ${{ runner.temp }}/CCPocketMenubar.zip
  polish:
    if: inputs.verification == 'polish'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
      - name: Read Flutter version
        id: sdk
        run: echo "version=$(sed -n 's/^flutter = "\(.*\)"/\1/p' .mise.toml)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          cache: true
      - name: Generate Flutter translations and format affected Dart files
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter gen-l10n
          git diff --name-only -z --relative --diff-filter=AM origin/feat/ui-icon-refresh...HEAD -- lib test |
            (while IFS= read -r -d '' file; do case "$file" in *.dart) printf '%s\0' "$file";; esac; done) |
            xargs -0 -r dart format
          git diff --binary -- lib test > "$RUNNER_TEMP/generated.patch"
          git diff --stat -- lib test
      - uses: actions/upload-artifact@v7
        with:
          name: generated-source-patch
          path: ${{ runner.temp }}/generated.patch
          if-no-files-found: error
  zh-previews:
    if: inputs.verification == 'zh-previews'
    name: Simplified Chinese UI (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        variant: [before, after]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: diagnostics
          sparse-checkout: scripts/zh-preview
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.variant == 'before' && '31ada26bac19ee7ec9e11c80222caa551ec8319d' || inputs.source_ref }}
          path: app
      - name: Read Flutter version
        id: sdk
        run: echo "version=$(sed -n 's/^flutter = "\(.*\)"/\1/p' app/.mise.toml)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          cache: true
      - name: Render Chinese app screens with synthetic data and the bundled icon font
        working-directory: app/apps/mobile
        env:
          PREVIEW_VARIANT: ${{ matrix.variant }}
          PREVIEW_OUTPUT: ${{ runner.temp }}/zh-previews
          PREVIEW_FONT: ${{ runner.temp }}/NotoSansCJKsc-Regular.otf
        run: |
          mkdir -p "$PREVIEW_OUTPUT"
          git rev-parse HEAD > "$PREVIEW_OUTPUT/$PREVIEW_VARIANT-source.txt"
          curl -fsSL --retry 3 -o "$PREVIEW_FONT" \
            https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf
          flutter pub get
          flutter gen-l10n
          python3 "$GITHUB_WORKSPACE/diagnostics/scripts/zh-preview/prepare.py"
          flutter test --no-pub --concurrency=1 --plain-name 'capture Chinese preview' \
            test/zh_home_preview_test.dart test/zh_theme_preview_test.dart test/zh_gallery_preview_test.dart
      - uses: actions/upload-artifact@v7
        with:
          name: zh-previews-${{ matrix.variant }}
          path: ${{ runner.temp }}/zh-previews
          if-no-files-found: error
  ios-system-language:
    if: inputs.verification == 'ios-system-language'
    name: iPhone Simulator system language, settings and theme
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: diagnostics
          sparse-checkout: scripts/zh-preview
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_ref }}
          path: app
      - name: Read Flutter version and pick an available iPhone
        id: sdk
        run: |
          echo "version=$(sed -n 's/^flutter = "\(.*\)"/\1/p' app/.mise.toml)" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json, os, re, subprocess
          devices = json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))['devices']
          iphones = [(tuple(map(int, re.findall(r'\d+', runtime.rsplit('iOS-', 1)[1]))), dev)
                     for runtime, entries in devices.items() if 'iOS-' in runtime
                     for dev in entries if dev.get('isAvailable') and dev['name'].startswith('iPhone')]
          version, phone = max(iphones, key=lambda pair: (pair[0], pair[1]['name'].endswith(' Pro'), pair[1]['name']))
          print('Using', phone['name'], version, phone['udid'])
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              print('PREVIEW_DEVICE=' + phone['udid'], file=env)
          PY
          xcrun simctl bootstatus "$(sed -n 's/^PREVIEW_DEVICE=//p' "$GITHUB_ENV" | tail -1)" -b
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          cache: true
      - name: Drive SettingsScreen twice with native language preferences
        working-directory: app/apps/mobile
        env:
          PREVIEW_OUTPUT: ${{ runner.temp }}/ios-language
        run: |
          mkdir -p "$PREVIEW_OUTPUT"
          git rev-parse HEAD > "$PREVIEW_OUTPUT/source.txt"
          python3 "$GITHUB_WORKSPACE/diagnostics/scripts/zh-preview/device.py"
          flutter pub get
          flutter gen-l10n
          for language in zh en; do
            if [ "$language" = zh ]; then
              language_tag=zh-Hans
              region=zh_CN
            else
              language_tag=en
              region=en_US
            fi
            xcrun simctl spawn "$PREVIEW_DEVICE" defaults write NSGlobalDomain AppleLanguages -array "$language_tag"
            xcrun simctl spawn "$PREVIEW_DEVICE" defaults write NSGlobalDomain AppleLocale -string "$region"
            xcrun simctl shutdown "$PREVIEW_DEVICE"
            xcrun simctl bootstatus "$PREVIEW_DEVICE" -b
            xcrun simctl spawn "$PREVIEW_DEVICE" defaults read NSGlobalDomain AppleLanguages
            xcrun simctl ui "$PREVIEW_DEVICE" appearance light
            flutter drive --no-pub -d "$PREVIEW_DEVICE" --driver=test_driver/zh_system_locale_driver.dart --target=integration_test/zh_system_locale_test.dart --dart-define=PREVIEW_EXPECTED_LANGUAGE="$language"
            test -s "$PREVIEW_OUTPUT/ios-$language-settings.png"
            test -s "$PREVIEW_OUTPUT/ios-$language-theme.png"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-system-language
          path: ${{ runner.temp }}/ios-language
          if-no-files-found: error
