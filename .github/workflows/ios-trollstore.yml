name: Build iOS TrollStore IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read Flutter version from .mise.toml
        id: mise
        run: echo "flutter_version=$(grep 'flutter' .mise.toml | sed 's/.*= *\"//' | sed 's/\"//')" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.mise.outputs.flutter_version }}
          cache: true

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze Flutter app
        working-directory: apps/mobile
        run: flutter analyze --no-fatal-infos

      - name: Test usage display
        working-directory: apps/mobile
        run: flutter test test/settings_usage_visibility_test.dart test/usage_pace_test.dart test/codex_usage_summary_test.dart test/usage_reset_card_test.dart

      - name: Build unsigned iOS app
        working-directory: apps/mobile
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --no-tree-shake-icons \
            --dart-define=REVENUECAT_PUBLIC_KEY=

      - name: Package IPA
        run: |
          APP_PATH="apps/mobile/build/ios/iphoneos/Runner.app"
          test -d "$APP_PATH"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/Payload/"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/Payload" \
            "$RUNNER_TEMP/CC-Pocket-TrollStore-unsigned.ipa"

      - name: Verify the IPA identity, Simplified Chinese permissions and bundled icons
        run: |
          python3 - <<'VERIFY'
          import json, os, pathlib, plistlib, re, subprocess, zipfile
          root = pathlib.Path("apps/mobile")
          version, build = re.search(r"^version: (.+)\+(\d+)$", (root / "pubspec.yaml").read_text(), re.M).groups()
          archive = pathlib.Path(os.environ["RUNNER_TEMP"]) / "CC-Pocket-TrollStore-unsigned.ipa"
          with zipfile.ZipFile(archive) as ipa:
              assert ipa.testzip() is None
              bundle = "Payload/Runner.app/"
              info = plistlib.loads(ipa.read(bundle + "Info.plist"))
              assert info["CFBundleIdentifier"] == "com.zwthys.ccpocket"
              assert (info["CFBundleShortVersionString"], info["CFBundleVersion"]) == (version, build)
              copy = ipa.read(bundle + "zh-Hans.lproj/InfoPlist.strings")
              localized = plistlib.loads(subprocess.check_output(["plutil", "-convert", "xml1", "-o", "-", "--", "-"], input=copy))
              for key in info:
                  if key.endswith("UsageDescription") and key in plistlib.loads((root / "ios/Runner/Info.plist").read_bytes()):
                      assert re.search(r"[\u3400-\u9fff]", localized[key]), key
              assets = bundle + "Frameworks/App.framework/flutter_assets/"
              font = "assets/fonts/icons/CCPocketIcons.otf"
              manifest = json.loads(ipa.read(assets + "FontManifest.json"))
              icons = [entry["fonts"] for entry in manifest if entry["family"] == "MaterialIcons"]
              assert len(icons) == 1 and [item["asset"] for item in icons[0]] == [font]
              assert ipa.read(assets + font) == (root / font).read_bytes()
              print(f"Verified CC Pocket {version}+{build}, Simplified Chinese permissions and icon font")
          VERIFY

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: CC-Pocket-TrollStore-unsigned-${{ github.sha }}
          path: ${{ runner.temp }}/CC-Pocket-TrollStore-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
