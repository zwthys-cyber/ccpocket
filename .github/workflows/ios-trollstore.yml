name: Capture CC Pocket UI refresh evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    name: Flutter UI (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: before
            ref: 5d0f0bf53703dd8ce927e0e7d8559034531dee37
          - variant: lavender
            ref: fea07efb0bf554797f559b7d445df956e6d19396
          - variant: after
            ref: c25d1a95ea983983cd5e06788980ebcb0a54357f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.ref }}
      - name: Read Flutter version
        id: mise
        run: echo "flutter_version=$(grep 'flutter' .mise.toml | sed 's/.*= *\"//' | sed 's/\"//')" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: ${{ steps.mise.outputs.flutter_version }}
          cache: true
      - name: Render the app's HomeContent at iPhone width with mock data
        working-directory: apps/mobile
        env:
          CCPOCKET_UI_VARIANT: ${{ matrix.variant }}
        run: |
          flutter pub get
          python3 - <<'PY'
          from pathlib import Path
          from os import environ

          source = Path('test/home_content_skeleton_test.dart').read_text()
          imports = """import 'dart:io';
          import 'dart:typed_data';
          import 'package:flutter/rendering.dart' show RenderRepaintBoundary;
          import 'package:flutter/services.dart' show FontLoader;
          import 'package:ccpocket/features/session_list/widgets/session_list_app_bar.dart';
          import 'package:ccpocket/mock/store_screenshot_data.dart';
          """
          source = imports + source
          source = source.replace(
              'Widget _buildHomeContent({',
              "Widget _buildHomeContent({\n  GlobalKey? screenshotKey,\n  ThemeData? screenshotTheme,",
              1,
          )
          new_session_action = (
              'isConnected: true, onNewSession: () {},'
              if environ['CCPOCKET_UI_VARIANT'] != 'before' else ''
          )
          source = source.replace(
              '      theme: AppTheme.darkTheme,\n      home: Scaffold(',
              """      theme: screenshotTheme ?? AppTheme.darkTheme,
                debugShowCheckedModeBanner: false,
                builder: (context, child) => RepaintBoundary(
                  key: screenshotKey,
                  child: child,
                ),
                home: Scaffold(
                  appBar: screenshotKey != null
                      ? PreferredSize(
                          preferredSize: const Size.fromHeight(kToolbarHeight),
                          child: CustomScrollView(
                            physics: const NeverScrollableScrollPhysics(),
                            slivers: [
                              SessionListSliverAppBar(
                                bridgeLabel: 'Demo Bridge',
                                onTitleTap: () {},
                                onDisconnect: () {},
                                onOpenSettings: () {},
                                onOpenGallery: () {},
                                NEW_SESSION_ACTION
                              ),
                            ],
                          ),
                        )
                      : null,""",
              1,
          )
          source = source.replace('NEW_SESSION_ACTION', new_session_action, 1)
          marker = "  group('HomeContent skeleton', () {"
          assert source.count(marker) == 1
          source = source.replace(marker, """  testWidgets('capture refresh evidence', (tester) async {
              tester.view.devicePixelRatio = 1;
              tester.view.physicalSize = const Size(402, 874);
              addTearDown(tester.view.resetDevicePixelRatio);
              addTearDown(tester.view.resetPhysicalSize);
              await tester.runAsync(() async {
                const fontPath = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf';
                final font = File(fontPath).existsSync()
                    ? File(fontPath)
                    : File('assets/fonts/code/DejaVuSansMono.ttf');
                final loader = FontLoader('EvidenceSans');
                loader.addFont(font.readAsBytes().then(ByteData.sublistView));
                await loader.load();
              });
              final out = Directory(Platform.environment['CCPOCKET_UI_OUTPUT']!);
              out.createSync(recursive: true);

              for (final (name, theme) in [
                ('home-light', AppTheme.lightTheme),
                ('home-dark', AppTheme.darkTheme),
              ]) {
                final key = GlobalKey();
                await tester.pumpWidget(
                  _buildHomeContent(
                    sessions: storeHomeRunningSessions().take(1).toList(),
                    recentSessions: storeRecentSessions(),
                    screenshotKey: key,
                    screenshotTheme: theme.copyWith(
                      platform: TargetPlatform.iOS,
                      textTheme: theme.textTheme.apply(fontFamily: 'EvidenceSans'),
                    ),
                    cubit: cubit,
                    draftService: draftService,
                    revenueCatService: revenueCatService,
                    supportBannerService: supportBannerService,
                  ),
                );
                await tester.pump(const Duration(milliseconds: 500));
                expect(find.text('CC Pocket'), findsOneWidget);
                expect(find.byType(HomeContent), findsOneWidget);
                expect(tester.takeException(), isNull);
                await tester.runAsync(() async {
                  final boundary =
                      key.currentContext!.findRenderObject()! as RenderRepaintBoundary;
                  final image = await boundary.toImage(pixelRatio: 2);
                  final bytes = (await image.toByteData())!.buffer.asUint8List();
                  final png = await image.toByteData(format: ImageByteFormat.png);
                  expect(bytes, isNotEmpty);
                  File('${out.path}/$name.png').writeAsBytesSync(
                    png!.buffer.asUint8List(png.offsetInBytes, png.lengthInBytes),
                  );
                  image.dispose();
                });
              }
              await tester.pumpWidget(const SizedBox.shrink());
            });

          """ + marker)
          source = "import 'dart:ui' show ImageByteFormat;\n" + source
          Path('test/ui_refresh_evidence_test.dart').write_text(source)
          PY
          export CCPOCKET_UI_OUTPUT="$RUNNER_TEMP/ccpocket-ui"
          flutter test --no-pub test/ui_refresh_evidence_test.dart --plain-name 'capture refresh evidence'
          printf '%s\n' "$(git rev-parse HEAD)" > "$CCPOCKET_UI_OUTPUT/commit.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: CC-Pocket-UI-${{ matrix.variant }}
          path: ${{ runner.temp }}/ccpocket-ui
          if-no-files-found: error
          retention-days: 30
