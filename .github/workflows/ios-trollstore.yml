name: Publish verified Bridge 1.122.0 packages
on: workflow_dispatch
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: zwthys-cyber/ccpocket
      RUN_ID: '45976797469'
      COMMIT: fa20a82c9f9203305e1220fd9fec39f1c7827de4
      TAG: bridge-maintained/v1.122.0-fa20a82
      MOBILE: trollstore/v1.140.9+272
    steps:
      - name: Verify immutable build and independent upgrade results
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" | jq --exit-status --arg sha "$COMMIT" '.conclusion=="success" and .head_sha==$sha'
          gh api "repos/$GH_REPO/actions/runs/45976993918" | jq --exit-status '.conclusion=="success"'
          test "$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')" = "$MOBILE"
      - name: Download exact artifact ZIPs and compare build manifests and SHA-256
        run: |
          set -euo pipefail
          for spec in             '15188150362 deepseek-server-runtime 0e2b41d3a45a45b0fe882cddde44a213540890548445c4c168976d1894c4398d'             '15187990707 deepseek-server-update c4354e5689ce23af9c5468acf00a6d27ef6ea5e0566f1948120a6c196881eef1'; do
            read -r artifact name expected <<< "$spec"
            gh api "repos/$GH_REPO/actions/artifacts/$artifact" | jq --exit-status --arg run "$RUN_ID" --arg name "$name" --arg digest "sha256:$expected" '.expired==false and .name==$name and .digest==$digest and (.workflow_run.id|tostring)==$run'
            gh api "repos/$GH_REPO/actions/artifacts/$artifact/zip" > "$name.zip"
            echo "$expected  $name.zip" | sha256sum --check --strict -
            test "$(unzip -p "$name.zip" BUILD_COMMIT)" = "$COMMIT"
            echo "$expected  $name.zip" >> SHA256SUMS
          done
      - name: Prepare and inspect release draft
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          此版本对应线上运行的 Bridge 1.122.0 维护补丁 `fa20a82`，包含 Codex 重连后重复气泡、插话时间和图库并发删除修复，图库列表支持按需缩略图。

          **Linux x64 下载**

          - `deepseek-server-runtime.zip` 包含完整运行包及依赖，适用于新安装。
          - `deepseek-server-update.zip` 是小型增量包，适用于已安装本项目 DeepSeek 维护版 Bridge 1.122.0 且依赖清单一致的服务器。
          - `SHA256SUMS` 包含两个 ZIP 的校验值，每个 ZIP 内附构建提交和运行包校验值。

          [完整构建与测试](https://github.com/zwthys-cyber/ccpocket/actions/runs/45976797469) · [旧版覆盖升级验证](https://github.com/zwthys-cyber/ccpocket/actions/runs/45976993918) · [配套手机客户端](https://github.com/zwthys-cyber/ccpocket/releases/tag/trollstore/v1.140.9%2B272)
          NOTES
          gh release create "$TAG" --repo "$GH_REPO" --target "$COMMIT" --draft --latest=false --title 'CC Pocket Bridge 1.122.0 · Linux x64 · fa20a82' --notes-file notes.md deepseek-server-runtime.zip deepseek-server-update.zip SHA256SUMS
          gh release view "$TAG" --repo "$GH_REPO" --json isDraft,targetCommitish | jq --exit-status --arg sha "$COMMIT" '.isDraft and .targetCommitish==$sha'
          for asset in deepseek-server-runtime.zip deepseek-server-update.zip SHA256SUMS; do
            expected="sha256:$(sha256sum "$asset" | cut -d' ' -f1)"
            gh release view "$TAG" --repo "$GH_REPO" --json assets | jq --exit-status --arg name "$asset" --arg digest "$expected" '[.assets[]|select(.name==$name and .digest==$digest)]|length==1'
          done
      - name: Publish Bridge assets and retain the TrollStore release as latest
        run: |
          set -euo pipefail
          gh release edit "$TAG" --repo "$GH_REPO" --draft=false --latest=false
          gh release view "$TAG" --repo "$GH_REPO" --json isDraft,targetCommitish,assets | jq --exit-status --arg sha "$COMMIT" '(.isDraft == false) and .targetCommitish==$sha and (.assets|length)==3'
          test "$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')" = "$MOBILE"
