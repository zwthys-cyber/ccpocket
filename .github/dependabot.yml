version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
    ignore:
      # This fork does not use the upstream Shorebird release service.
      - dependency-name: "shorebirdtech/setup-shorebird"
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/packages/bridge"
    schedule:
      interval: "weekly"
      day: "monday"
    allow:
      - dependency-name: "@anthropic-ai/claude-agent-sdk"
      - dependency-name: "@openai/codex-sdk"
    commit-message:
      prefix: "chore(bridge)"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
